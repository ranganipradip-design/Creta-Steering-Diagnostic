      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 using runner preinstalled command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          test -d "$SDK_ROOT/cmdline-tools" || { echo 'Android SDK cmdline tools missing on runner'; exit 1; }
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo 'sdkmanager missing'; exit 1; }
          # Accept existing SDK licenses; GitHub hosted Ubuntu runners have command-line tools preinstalled.
          (yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1) || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile AutoScan Pro debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate and name APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          cp "$APK" 'AutoScan-Pro-2.7.8-debug.apk'
          # Android SDK build tools provide aapt for verifying the packaged icon.
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > /tmp/autoscan_apk_badging.txt
          grep -E '^(package:|application-label:|application-icon-|sdkVersion:|targetSdkVersion:)' /tmp/autoscan_apk_badging.txt || true
          grep -q "^application-label:'AutoScan Pro'" /tmp/autoscan_apk_badging.txt
          unzip -l "$APK" > /tmp/autoscan_apk_contents.txt
          grep -q 'res/' /tmp/autoscan_apk_contents.txt
          sha256sum 'AutoScan-Pro-2.7.8-debug.apk'

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: AutoScan-Pro-2.7.8-Android-APK
          path: AutoScan-Pro-2.7.8-debug.apk
          if-no-files-found: error
          retention-days: 30
