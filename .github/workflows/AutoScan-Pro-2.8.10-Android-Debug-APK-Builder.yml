# Standalone workflow with AutoScan Pro 2.8.10 Android source bundled below.
# Save as .github/workflows/build-debug-apk.yml on the default branch, then run manually.
# Debug APK is for development and has not been validated on the user's Creta/CaRPM.
name: AutoScan Pro 2.8.10 - Build Android DEBUG APK (Bundled Source)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
