      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile AutoScan Pro debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate and name APK
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          cp "$APK" 'AutoScan-Pro-2.7.1-debug.apk'
          # Android SDK build tools provide aapt for verifying the packaged icon.
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > /tmp/autoscan_apk_badging.txt
          grep -E '^(package:|application-label:|application-icon-|sdkVersion:|targetSdkVersion:)' /tmp/autoscan_apk_badging.txt || true
          grep -q "^application-label:'AutoScan Pro'" /tmp/autoscan_apk_badging.txt
          unzip -l "$APK" > /tmp/autoscan_apk_contents.txt
          grep -q 'res/' /tmp/autoscan_apk_contents.txt
          sha256sum 'AutoScan-Pro-2.7.1-debug.apk'

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: AutoScan-Pro-2.7.1-Android-APK
          path: AutoScan-Pro-2.7.1-debug.apk
          if-no-files-found: error
          retention-days: 30
