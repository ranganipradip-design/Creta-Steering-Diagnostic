          base64 -d source.zip.b64 > source.zip
          unzip -oq source.zip -d .
          echo "Generated Android source files from the embedded v0.3 project."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Fix Kotlin ScrollView Error
        shell: bash
        run: |
          sed -i 's/fillViewport/isFillViewport/g' app/src/main/java/in/silken/cretadiag/MainActivity.kt

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug


      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Auto-Diagnostic-Pro-v03-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
